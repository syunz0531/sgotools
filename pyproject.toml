[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgotools"
version = "0.1.0"
description = "Reproducible access to NHTSA Standing General Order crash reports for automated and driver-assistance vehicles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Seoyoung Lee" }]
keywords = [
    "NHTSA", "crash data", "automated driving", "ADAS", "road safety",
    "reproducibility", "open data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/syunz0531/sgotools"
Issues = "https://github.com/syunz0531/sgotools/issues"

[project.scripts]
sgotools = "sgotools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sgotools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
